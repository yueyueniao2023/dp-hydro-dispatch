# 原参数场景：如实保留龙羊峡年末2600 m，因此会输出物理无解诊断。
# 源文件没有标注年份/单位，以下为显式、可修改的数据解释假设。
raw.directory=raw
calendar.days=365
# 用户明确确认：input5已经是两库之间的区间来水，尽管附带旧说明称为入库流量。
interval.mode=input5-as-interval
storage.toM3=100000000
power.toMW=1
upstream.levelStep=0.5
downstream.levelStep=0.5
upstream.headLoss=0
downstream.headLoss=0
enforceGuaranteedPower=false
# 可选：upstream.terminalLevel / downstream.terminalLevel，必须显式指定。
# 可选：upstream.monthlyLevelLimits / downstream.monthlyLevelLimits，逗号分隔12项。
# 区间资料补齐后可选 monthly-net / daily-upstream-release 并指定 interval.file。
# zPlanLYX 与本次调度无关，不读取、不用于还原区间来水。
